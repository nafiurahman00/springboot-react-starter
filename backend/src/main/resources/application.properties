# ===================================================================
# Application configuration (MySQL)
# -------------------------------------------------------------------
# The README explains how to switch to PostgreSQL / Supabase / MongoDB.
# ===================================================================

spring.application.name=app

# ----- MySQL datasource -----
# 1) Install MySQL and start it.
# 2) Create the database:   CREATE DATABASE app_db;
# 3) Put YOUR username/password below (or set env vars DB_USERNAME / DB_PASSWORD).
spring.datasource.url=jdbc:mysql://localhost:3306/app_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
# ddl-auto=update lets Hibernate create/update tables from your @Entity classes.
# Great for learning; use "validate" or migrations (Flyway/Liquibase) in real apps.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ----- Server -----
server.port=8080

# ----- JWT settings (read by JwtService) -----
# CHANGE THIS SECRET in any real project. Must be at least 32 characters (HS256).
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-demo-secret-key-please-replace-32+chars}
# Token lifetime in milliseconds (default 24 hours).
app.jwt.expiration-ms=86400000

# ----- CORS: which frontend origins may call this API -----
# Vite dev server runs on 5173 by default.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ----- Swagger / OpenAPI -----
springdoc.swagger-ui.path=/swagger-ui.html
